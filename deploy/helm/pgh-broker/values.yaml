replicaCount: 1

image:
  repository: ghcr.io/example/pgh-broker
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8080

databaseURL:
  secretName: pgh-broker-database
  secretKey: url

encryptionKeyring:
  secretName: pgh-broker-encryption
  keysSecretKey: keys
  activeKeyIDSecretKey: active-key-id

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
