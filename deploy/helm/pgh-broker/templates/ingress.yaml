{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "pgh-broker.fullname" . }}
  labels:
    {{- include "pgh-broker.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ required "ingress.className is required when ingress is enabled" .Values.ingress.className }}
  tls:
    - hosts:
        - {{ required "ingress.host is required when ingress is enabled" .Values.ingress.host | quote }}
      secretName: {{ required "ingress.tlsSecretName is required when ingress is enabled" .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "pgh-broker.fullname" . }}
                port:
                  name: http
{{- end }}
