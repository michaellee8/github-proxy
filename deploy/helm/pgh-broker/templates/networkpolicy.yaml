{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pgh-broker.fullname" . }}
  labels:
    {{- include "pgh-broker.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pgh-broker.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - protocol: TCP
          port: http
  egress:
    {{- toYaml .Values.networkPolicy.egress | nindent 4 }}
{{- end }}
